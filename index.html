<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design Challenge SLOT</title>

<style>
:root{
  --neon:#ff2e63;
  --gold:#ffcc00;
  --glow: 0;
}

body{
  margin:0;
  font-family:system-ui;
  background:radial-gradient(circle at top,#0b1028,#000);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px;
}

h1{margin:10px 0;}

.cabinet{
  margin-top:10px;
  width:min(900px,95vw);
  background:linear-gradient(145deg,#2a2a33,#0f0f14);
  border-radius:30px;
  padding:25px;
  box-shadow:0 30px 80px rgba(0,0,0,0.8);
  position:relative;
  border:3px solid rgba(255,255,255,0.08);
  transition: box-shadow 0.2s ease;
}

/* LED GLOW SYSTEM */
.cabinet.glowPulse{
  box-shadow:
    0 0 10px rgba(255,46,99,0.4),
    0 0 30px rgba(255,204,0,0.3),
    0 0 60px rgba(255,46,99,0.2);
}

.cabinet::before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:24px;
  border:2px solid rgba(255,204,0,0.15);
  pointer-events:none;
}

.screen{
  background:rgba(255,255,255,0.06);
  border-radius:20px;
  padding:20px;
  backdrop-filter:blur(12px);
}

.reels{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}

.reel-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.reel{
  width:140px;
  height:80px;
  overflow:hidden;
  border-radius:12px;
  background:linear-gradient(#fff,#e6e6e6);
  color:#000;
  border:2px solid rgba(0,0,0,0.2);
  position:relative;
}

.reel-inner{position:absolute;width:100%;will-change:transform;}

.item{
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.label{
  font-size:12px;
  opacity:0.7;
  margin-top:6px;
  text-transform:uppercase;
}

.blur{filter:blur(4px);}

button{
  margin-top:16px;
  padding:12px 24px;
  border:none;
  border-radius:12px;
  font-size:16px;
  color:#fff;
  background:linear-gradient(135deg,var(--neon),#ff7a18);
  cursor:pointer;
  box-shadow:0 10px 30px rgba(255,46,99,0.4);
}

.result{margin-top:14px;min-height:40px;font-size:16px;text-align:center;}
.history{margin-top:10px;font-size:13px;opacity:0.8;}
.glow{box-shadow:0 0 18px var(--gold);}
.jackpot{animation:flash 0.2s infinite alternate;}
@keyframes flash{from{box-shadow:0 0 10px #ffcc00;}to{box-shadow:0 0 40px #ffcc00;}}
</style>
</head>
<body>

<h1>🎰 Design Challenge SLOT</h1>

<div class="cabinet" id="cabinet">
  <div class="screen">
    <div class="reels" id="reels"></div>
  </div>
</div>

<button onclick="spinAll()">SPIN</button>

<div class="result" id="result"></div>
<div class="history" id="history"></div>

<script>
const data={
item:["coffee cup","chair","sneakers","backpack","lamp","phone","camera","sofa","water bottle","watch","headphones","bike","controller","tablet","keyboard","mouse","sunglasses","jacket","bag","thermos","bed","speaker","coffee machine","suitcase","scooter","drone","helmet","lunch box","shower","modular bag"],
brand:["Nike","Apple","Ikea","Adidas","Tesla","Lego","Sony","Muji","Samsung","Patagonia","Dyson","Gucci","Balenciaga","Microsoft","Google","Amazon","Puma","Zara","H&M","B&O"],
style:["minimalist","futuristic","retro","nature","luxury","playful","brutalist","scandi","high-tech","handmade"],
audience:["kids","teens","students","professionals","athletes","seniors","creatives","minimalists"],
wildcard:["single material","under $10","space use","recycled","modular","pocket","one-hand","no electricity"]
};

const order=["item","brand","style","audience","wildcard"];
const refs={};
const reels=document.getElementById("reels");
const cabinet=document.getElementById("cabinet");

order.forEach(k=>{
  const wrap=document.createElement("div");
  wrap.className="reel-wrap";

  const reel=document.createElement("div");
  reel.className="reel";

  const inner=document.createElement("div");
  inner.className="reel-inner";
  inner.id=k;

  inner.innerHTML=data[k].concat(data[k]).map(i=>`<div class='item'>${i}</div>`).join("");

  reel.appendChild(inner);
  wrap.appendChild(reel);

  const label=document.createElement("div");
  label.className="label";
  label.textContent=k;
  wrap.appendChild(label);

  reels.appendChild(wrap);
  refs[k]=inner;
});

const AudioCtx=window.AudioContext||window.webkitAudioContext;
const audioCtx=new AudioCtx();

function tick(){
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type="triangle";
  o.frequency.value=900;
  g.gain.value=0.04;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+0.06);

  // LED CABINET PULSE
  cabinet.classList.add("glowPulse");
  setTimeout(()=>cabinet.classList.remove("glowPulse"),80);
}

function hum(){
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type="sine";
  o.frequency.value=100;
  g.gain.value=0.03;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+0.3);
}

function jackpot(){
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type="sine";
    o.frequency.value=f;
    g.gain.value=0.05;
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime+0.2);
  },i*120));
}

function spinWheel(el,items,duration,cb){
  el.classList.add("blur");

  let start=null;
  let pos=0;
  let speed=22;

  function frame(t){
    if(!start) start=t;
    const elapsed=t-start;

    speed*=0.985;
    pos+=speed;

    el.style.transform=`translateY(-${pos}px)`;

    if(Math.random()<0.15) tick();

    if(elapsed<duration){
      requestAnimationFrame(frame);
    } else {
      const final=items[Math.floor(Math.random()*items.length)];
      const index=items.indexOf(final);

      el.style.transform=`translateY(-${index*80}px)`;
      el.dataset.final=final;

      el.classList.remove("blur");
      el.parentElement.classList.add("glow");
      setTimeout(()=>el.parentElement.classList.remove("glow"),600);

      cb();
    }
  }

  requestAnimationFrame(frame);
}

function spinAll(){
  audioCtx.resume();

  let done=0;
  let jackpotMode=Math.random()<0.07;

  if(jackpotMode) cabinet.classList.add("glowPulse");

  hum();

  order.forEach((k,i)=>{
    setTimeout(()=>spinWheel(refs[k],data[k],1400+i*250,check),i*120);
  });

  function check(){
    done++;
    if(done===order.length){
      if(jackpotMode) jackpot();
      show();
      setTimeout(()=>cabinet.classList.remove("glowPulse"),2000);
    }
  }
}

function show(){
  const v=order.map(k=>refs[k].dataset.final).join(" ");
  document.getElementById("result").textContent="Design: "+v;
}
</script>
</body>
</html>
