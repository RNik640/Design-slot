<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Design Challenge SLOT</title>

<link rel="manifest" href="manifest.json">

<style>
body{
  margin:0;
  font-family:system-ui;
  background:radial-gradient(circle at top,#0b1028,#000);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px;
}

h1{margin:10px 0;}

.cabinet{
  width:min(900px,95vw);
  background:linear-gradient(145deg,#2a2a33,#0f0f14);
  border-radius:30px;
  padding:25px;
  box-shadow:0 30px 80px rgba(0,0,0,0.8);
  border:3px solid rgba(255,255,255,0.08);
  transition:0.2s;
}

.reels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

.reel{width:140px;height:80px;overflow:hidden;background:#fff;color:#000;border-radius:10px;position:relative;}
.reel-inner{position:absolute;width:100%;will-change:transform;}
.item{height:80px;display:flex;align-items:center;justify-content:center;font-weight:700;}

button{
  margin-top:16px;
  padding:12px 24px;
  border:none;
  border-radius:12px;
  font-size:16px;
  background:#ff2e63;
  color:#fff;
}

.glow{
  box-shadow:0 0 25px #ffcc00;
}
</style>
</head>

<body>

<h1>🎰 Design Challenge SLOT</h1>

<div class="cabinet" id="cabinet">
  <div class="reels" id="reels"></div>
</div>

<button onclick="spinAll()">SPIN</button>

<div id="result" style="margin-top:15px;text-align:center;"></div>

<script>
const data={
item:["chair","lamp","phone","bag","bike","sofa"],
brand:["Nike","Apple","Ikea","Tesla","Sony"],
style:["minimalist","retro","luxury","futuristic"],
audience:["kids","teens","professionals","creators"],
wildcard:["eco","cheap","space","modular"]
};

const order=["item","brand","style","audience","wildcard"];
const refs={};
const reels=document.getElementById("reels");

order.forEach(k=>{
  const wrap=document.createElement("div");

  const reel=document.createElement("div");
  reel.className="reel";

  const inner=document.createElement("div");
  inner.className="reel-inner";
  inner.id=k;

  inner.innerHTML=data[k].concat(data[k]).map(x=>`<div class='item'>${x}</div>`).join("");

  reel.appendChild(inner);
  wrap.appendChild(reel);
  reels.appendChild(wrap);

  refs[k]=inner;
});

function spinWheel(el,items,duration,cb){
  let pos=0;
  let speed=20;
  let start=null;

  function frame(t){
    if(!start) start=t;
    let elapsed=t-start;

    speed*=0.985;
    pos+=speed;

    el.style.transform=`translateY(-${pos}px)`;

    if(elapsed<duration){
      requestAnimationFrame(frame);
    }else{
      const final=items[Math.floor(Math.random()*items.length)];
      const index=items.indexOf(final);
      el.style.transform=`translateY(-${index*80}px)`;
      el.dataset.final=final;
      cb();
    }
  }
  requestAnimationFrame(frame);
}

function spinAll(){
  let done=0;

  order.forEach((k,i)=>{
    setTimeout(()=>{
      spinWheel(refs[k],data[k],1200+i*200,check);
    },i*100);
  });

  function check(){
    done++;
    if(done===order.length){
      const result=order.map(k=>refs[k].dataset.final).join(" ");
      document.getElementById("result").textContent=result;
    }
  }
}
</script>

</body>
</html>
